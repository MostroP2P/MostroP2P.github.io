  {name:{es:'LA CITY',en:'THE CITY',fr:'LA CITY',it:'LA CITY',nl:'DE CITY',pt:'A CITY'},len:5200,pit:[90,120],en:.5,fast:0,fly:0,bolts:2,sky:['#0a0c11','#111722'],city:'#121823',storm:false},
  {name:{es:'CALLE KYC',en:'KYC STREET',fr:'RUE KYC',it:'VIA KYC',nl:'KYC-STRAAT',pt:'RUA KYC'},len:6200,pit:[100,132],en:.65,fast:.35,fly:.2,bolts:3,sky:['#120a18','#2a1422'],city:'#18132a',storm:false},
  {name:{es:'BANCO CENTRAL',en:'CENTRAL BANK',fr:'BANQUE CENTRALE',it:'BANCA CENTRALE',nl:'CENTRALE BANK',pt:'BANCO CENTRAL'},len:7000,pit:[110,142],en:.8,fast:.55,fly:.32,bolts:3,sky:['#04060a','#111620'],city:'#0f141c',storm:true}
];
// Language: ?lang= first (the site's links pass it), then the browser's languages, then English.
function pickLang(){
  const q=new URLSearchParams(location.search).get('lang');
  const cands=[q,...(navigator.languages||[navigator.language])];
  for(const c of cands){const k=(c||'').slice(0,2).toLowerCase();if(T[k])return k;}
  return 'en';
}
let lang=pickLang();
const isTouch=('ontouchstart' in window)||window.matchMedia('(pointer:coarse)').matches;
const $=id=>document.getElementById(id);
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=T[lang][el.dataset.i]);
  $('langSel').value=lang;
  document.querySelectorAll('.home-link').forEach(a=>a.href=lang==='en'?'/':`/${lang}/`);
  $('ctrlTxt').textContent=(isTouch?T[lang].ctrlT:T[lang].ctrlK)+' · '+T[lang].tips;
  fillOverlays();
}
$('langSel').addEventListener('change',e=>{
  lang=e.target.value;applyLang();e.target.blur();
  const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);
});

// ================= audio: sfx, music, thunder =================
let ac=null,master=null,musGain=null,noiseBuf=null,muted=false;
$('muteBtn').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:1;e.currentTarget.blur();});
function ensureAudio(){
  try{
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
      musGain=ac.createGain();musGain.gain.value=.55;musGain.connect(master);
      noiseBuf=ac.createBuffer(1,ac.sampleRate*2.5,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(ac.state==='suspended')ac.resume();
  }catch(e){ac=null;}
  return !!ac;
}
function tone(f1,f2,d,tp,delay,vol,dest){
  const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+(delay||0);
  o.type=tp;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(vol||.05,n);g.gain.exponentialRampToValueAtTime(.0005,n+d);
  o.connect(g);g.connect(dest||master);o.start(n);o.stop(n+d+.03);
}
function noise(dur,vol,ftype,f1,f2,delay,dest){
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),n=ac.currentTime+(delay||0);
  s.buffer=noiseBuf;f.type=ftype;f.frequency.setValueAtTime(f1,n);f.frequency.exponentialRampToValueAtTime(f2,n+dur);
  g.gain.setValueAtTime(.0005,n);g.gain.exponentialRampToValueAtTime(vol,n+.015);g.gain.exponentialRampToValueAtTime(.0005,n+dur);
  s.connect(f);f.connect(g);g.connect(dest||master);s.start(n,Math.random()*.5);s.stop(n+dur+.05);
}
let lastThunder=0;
function thunder(power){
  if(!ac||muted)return;
  const now=performance.now();if(now-lastThunder<350)return;lastThunder=now;
  try{
    noise(.14,.25*power,'highpass',3000,1200,0);          // crack
    noise(2.2,.38*power,'lowpass',900,90,.06);             // rumble
    tone(70,38,1.6,'sine',.05,.12*power);                  // body
  }catch(e){}
}
function sfx(type){
  if(muted||!ensureAudio())return;
  try{

const mf=m=>440*Math.pow(2,(m-69)/12);
function mNote(m,time,dur,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(mf(m),time);
  g.gain.setValueAtTime(.0005,time);g.gain.exponentialRampToValueAtTime(vol,time+.01);g.gain.exponentialRampToValueAtTime(.0005,time+dur);
  o.connect(g);g.connect(musGain);o.start(time);o.stop(time+dur+.02);

function mHat(time,vol){
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;
  g.gain.setValueAtTime(vol,time);g.gain.exponentialRampToValueAtTime(.0005,time+.04);
  s.connect(f);f.connect(g);g.connect(musGain);s.start(time,Math.random());s.stop(time+.06);

function mKick(time){

  o.frequency.setValueAtTime(140,time);o.frequency.exponentialRampToValueAtTime(40,time+.12);
  g.gain.setValueAtTime(.25,time);g.gain.exponentialRampToValueAtTime(.0005,time+.16);
  o.connect(g);g.connect(musGain);o.start(time);o.stop(time+.2);

function sched(){
  if(!song||!ac)return;
  const sp=60/song.bpm/4;
  if(nextT<ac.currentTime-.2)nextT=ac.currentTime+.02;
  while(nextT<ac.currentTime+.12){
    const b=song.bass[step%song.bass.length],l=song.lead[step%song.lead.length];
    if(b)mNote(b,nextT,sp*1.8,'triangle',.2);
    if(l)mNote(l,nextT,sp*.9,song.wave,song.wave==='sawtooth'?.035:.05);
    if(song.hat&&step%2===0)mHat(nextT,step%4===2?.05:.025);
    if(song.kick&&step%8===0)mKick(nextT);

  }

const SYM=['$','€','£','¥'];
function seeded(s){return()=>(s=(s*9301+49297)%233280)/233280;}
let WORLD,solids,enemies,coins,bolts,checkpoints,goal,particles=[];
function genLevel(n){
  const L=LEVELS[n],rnd=seeded(4242+n*1337),R=(a,b)=>a+rnd()*(b-a);
  const ground=[],plats=[],pils=[],ens=[],cs=[],landings=[];
  const coin=(x,y)=>cs.push({x,y,s:SYM[cs.length%4],got:false,ph:cs.length*.7});
  const walker=(x0,x1,py)=>ens.push({kind:'w',x:x0+(x1-x0-34)*rnd(),y:(py||G)-30,w:34,h:30,min:x0,max:x1-34,
      vx:(rnd()<.5?-1:1)*(rnd()<L.fast?1.9:1.15),alive:true,dead:0});
  for(let i=0;i<5;i++)coin(160+i*50,420);
  let x=560,seg=0,last=-1;
  while(x<L.len-600){
    let r=rnd();if(last===0&&r<.25)r=.3+rnd()*.7;
    if(r<.25){last=0;
      const w=Math.round(R(L.pit[0],L.pit[1]));
      ground.push([seg,x]);
      coin(x-10,350);coin(x+w/2,322);coin(x+w+10,350);
      x+=w;seg=x;landings.push(x+30);x+=170;
    }else if(r<.45){last=1;
      const h=Math.round(R(60,110));pils.push([x+50,h]);
      coin(x+60,G-h-40);coin(x+78,G-h-56);coin(x+96,G-h-40);
      const wk=rnd()<L.en*.6;if(wk)walker(x+140,x+400);
      x+=wk?420:230;
    }else if(r<.72){last=2;
      const k=1+Math.floor(rnd()*3),x0=x;let y=360;
      for(let i=0;i<k;i++){
        plats.push([x,y,130]);coin(x+35,y-30);coin(x+95,y-30);
        if(i===k-1&&k>1&&rnd()<L.en*.5)walker(x,x+130,y);
        x+=190;y=Math.max(210,y-70);
      }
      if(rnd()<L.en*.5)walker(x0,x);
      x+=80;
    }else{last=3;
      const w=Math.round(R(320,460));
      walker(x,x+w);if(rnd()<L.en*.45)walker(x,x+w);
      for(let i=0;i<4;i++)coin(x+60+i*((w-120)/3),340);
      x+=w+40;
    }
    if(rnd()<L.fly){const by=R(235,290);
      ens.push({kind:'f',x:x-200,y:by,by,amp:R(20,38),ph:rnd()*6,w:38,h:26,min:x-320,max:x-80,vx:(rnd()<.5?-1:1)*1.3,alive:true,dead:0});}
  }
  const final=n===LEVELS.length-1;
  ground.push([seg,L.len+(final?700:500)]);
  WORLD=L.len+(final?700:500);
  solids=[];
  ground.forEach(([a,b])=>solids.push({x:a,y:G,w:b-a,h:H-G+40,type:'g'}));
  plats.forEach(([px,py,pw])=>solids.push({x:px,y:py,w:pw,h:22,type:'p'}));
  pils.forEach(([px,h])=>solids.push({x:px,y:G-h,w:56,h,type:'b'}));
  enemies=ens;coins=cs;bolts=[];
  for(let i=1;i<=L.bolts;i++){
    const bx=Math.round(L.len*i/(L.bolts+1));let by=300;
    const hit=s=>s.type!=='g'&&bx+16>s.x&&bx-16<s.x+s.w&&by+18>s.y&&by-18<s.y+s.h;
    if(solids.some(hit))by=170;
    bolts.push({x:bx,y:by,got:false,ph:i});
  }
  const near=tx=>landings.reduce((a,b)=>Math.abs(b-tx)<Math.abs(a-tx)?b:a,landings[0]||60);
  checkpoints=[60];
  if(landings.length){const c1=near(L.len/3),c2=near(L.len*2/3);if(c1>200)checkpoints.push(c1);if(c2>c1+300)checkpoints.push(c2);}
  goal=final?{x:L.len+330,y:356,r:64,final:true}:{x:L.len+200,y:376,r:46,final:false};
}

// ================= logic =================
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function puff(x,y,text,color,n){
  if(text)particles.push({x,y,vx:0,vy:-1.2,life:45,text,color});
  for(let i=0;i<(n||0);i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.8)*3,life:25+Math.random()*15,color,dot:true});
}
function setSize(s){p.s=s;p.w=34*s;p.h=58*s;}
function tryGrow(){
  if(Math.abs(p.s-p.ts)<.001)return;
  const ns=p.s<p.ts?Math.min(p.ts,p.s+.012):Math.max(p.ts,p.s-.03);
  const nw=34*ns,nh=58*ns,test={x:p.x-(nw-p.w)/2,y:p.y-(nh-p.h),w:nw,h:nh};
  if(ns>p.s&&solids.some(s=>ov(test,s)))return;
  p.x=test.x;p.y=test.y;setSize(ns);
}
function hurt(){
  lives--;sfx('hurt');buzz(140);puff(p.x+p.w/2,p.y+p.h/2,null,'#8BC53F',14);p.bolt=0;
  if(lives<=0){state='over';levelEnd=performance.now();stopMusic();showOverlay('overOv',0);return;}
  p.ts=Math.max(1,p.ts-.2);setSize(p.ts);
  p.x=cp;p.y=G-260;p.vx=0;p.vy=0;p.inv=110;
}
function killEnemy(e,col){e.alive=false;e.dead=24;lv.kyc++;sfx('stomp');buzz(25);puff(e.x+e.w/2,e.y+10,null,col,12);}
function makeArcs(){
  arcs=[];
  for(let i=0;i<7;i++){
    const a=Math.random()*Math.PI*2,len=50+Math.random()*110;let r=goal.r+2;
    const pts=[[Math.cos(a)*r,Math.sin(a)*r]];
    for(let k=1;k<=6;k++){r=goal.r+2+len*k/6;const aa=a+(Math.random()-.5)*.5;pts.push([Math.cos(aa)*r,Math.sin(aa)*r]);}
    arcs.push(pts);
  }
}
function update(){
  t++;
  particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;if(q.dot)q.vy+=.15;q.life--;});
  particles=particles.filter(q=>q.life>0);
  if(level===2){for(const d of rain){d.y+=d.v;d.x-=d.v*.25;if(d.y>H){d.y=-20;d.x=Math.random()*1400;}}}
  if(flash>0)flash--;
  if(LEVELS[level].storm&&state!=='menu'&&flash===0&&Math.random()<.005){flash=14;flashX=Math.random()*W;setTimeout(()=>thunder(.7),200+Math.random()*500);}
  if(winFlash>0)winFlash--;
  if(strike>0)strike--;
  if(goal&&goal.final&&t%3===0)makeArcs();
  if(goal&&goal.final&&state==='play'){
    const gx=goal.x-cam;
    if(gx>-100&&gx<W+100&&strike===0&&Math.random()<.018){strike=10;strikeX=gx+(Math.random()-.5)*360;thunder(.55);}
  }
  if(state==='win'){const tg=Math.max(0,Math.min(WORLD-W,goal.x-W*.72));cam+=(tg-cam)*.06;}
  if(state!=='play')return;
  if(banner>0)banner--;

  const boost=p.bolt>0,maxV=boost?6.6:4.6;
  if(keys.left){p.vx=Math.max(p.vx-.6,-maxV);p.face=-1;}
  else if(keys.right){p.vx=Math.min(p.vx+.6,maxV);p.face=1;}
  else p.vx*=.78;
  if(Math.abs(p.vx)<.05)p.vx=0;
  p.walk=((p.walk||0)+Math.abs(p.vx)*.06)%6; // walk-cycle frame, advances with speed
  p.coyote=p.onGround?6:p.coyote-1;
  if(keys.jumpPressed){p.jumpBuf=8;keys.jumpPressed=false;}else p.jumpBuf--;
  if(p.jumpBuf>0&&p.coyote>0){p.vy=boost?-13.6:-12.8;p.coyote=0;p.jumpBuf=0;sfx('jump');}
  if(!keys.jump&&p.vy<-4)p.vy+=.9;
  p.vy=Math.min(p.vy+.62,14);

  p.x+=p.vx;if(p.x<0){p.x=0;p.vx=0;}
  for(const s of solids)if(ov(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0;}
  p.y+=p.vy;p.onGround=false;
  for(const s of solids)if(ov(p,s)){if(p.vy>0){p.y=s.y-p.h;p.vy=0;p.onGround=true;}else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}}
  tryGrow();
  if(p.inv>0)p.inv--;
  if(p.chew>0)p.chew--;
  if(p.bolt>0){
    p.bolt--;
    if(t%2===0)particles.push({x:p.x+p.w/2-p.face*14,y:p.y+p.h*.3+Math.random()*p.h*.55,vx:-p.face*.5,vy:0,life:16,color:Math.random()<.5?'#FFE14D':'#8BC53F',dot:true});
    if(t%9===0)sfx('crackle');
  }
  p.blink=(t%180<6)?1:0;

  for(const c of checkpoints)if(p.x>c&&c>cp){cp=c;puff(c+15,G-80,'⚡','#8BC53F',8);}

  for(const e of enemies){
    if(!e.alive){e.dead--;continue;}
    e.x+=e.vx;if(e.x<e.min){e.x=e.min;e.vx*=-1;}if(e.x>e.max){e.x=e.max;e.vx*=-1;}
    if(e.kind==='f')e.y=e.by+Math.sin(t*.045+e.ph)*e.amp;
    if(ov(p,e)){
      if(p.bolt>0)killEnemy(e,'#FFE14D');
      else if(p.vy>0&&p.y+p.h-e.y<20){killEnemy(e,e.kind==='f'?'#6c86b5':'#C94B4B');p.vy=-9.5;}
      else if(p.inv<=0)hurt();
      if(state!=='play')return;
    }
  }
  for(const c of coins){
    if(c.got)continue;
    if(c.x>p.x-12&&c.x<p.x+p.w+12&&c.y>p.y-12&&c.y<p.y+p.h+12){
      c.got=true;lv.fiat++;p.chew=14;p.ts=Math.min(1.3,p.ts+.008);sfx('coin');puff(c.x,c.y-10,T[lang].nom,'#E8C547',6);
    }
  }
  for(const b of bolts){
    if(b.got)continue;
    if(b.x>p.x-14&&b.x<p.x+p.w+14&&b.y>p.y-16&&b.y<p.y+p.h+16){b.got=true;lv.bolts++;p.bolt=330;flash=10;flashX=b.x-cam;sfx('bolt');buzz(40);puff(b.x,b.y-14,'LIGHTNING ⚡','#FFE14D',16);}
  }
  if(p.y>H+80){hurt();if(state!=='play')return;}
  const dx=(p.x+p.w/2)-goal.x,dy=(p.y+p.h/2)-goal.y;

// Palette taken from the original front-facing sprite.
const MPAL={K:'#140a08',G:'#b4de33',g:'#86a72a',Y:'#f9ca09',W:'#fdf7e5',O:'#fb631b',o:'#b84612',
  B:'#6d3e3a',b:'#4b2824',J:'#34749e',j:'#24557a',S:'#fdf7e5',T:'#186878',L:'#f9ca09'};
const MW=26,MH=31,M_HIP=19,M_ANKLE=26;
const M_HEAD=[
  '..........KKKKKK',
  '........KKGGGGGGKK',
  '.KK...KGGGGGGKKKKGK',
  '.KGKKKGGGGGGGKYYYKGGK',
  '..KGGGGGGGGGGKYYKKGGGK',
  '...KGGGGGGGGGKYYYKGGGK',
  '...KgGGGGGGGGGKKKGGGGK',
  '....KgGGGGGGGGGGKWKWKK',
  '.....KggGGGGGGGGGKKKK',
  '......KKggggggGK'];
const M_BODY=[
  '.......KKKKKKKKKKK',
  '......KBBBBOOOOOOK',
  '.....KBBBBBOOOOOOOK',
  '.....KBBBBBOOKKOOOK',
  '.....KBBBBBOOKoOOOK',
  '.....KBBBBBOOOOOOOK',
  '.....KbBBBBOOOOOOOK',
  '.....KbbbbbbbbbbbbK',
  '......KJJJJJJJJJJK'];
const M_SHOE=['.KKKK..','KTTLTK.','KSSSSSK','.KKKKK.'];
const M_HAND=['.KK.','KGGK','KGGK','.KK.'];
function mPx(c,x,y,k){if(k==='.')return;c.fillStyle=MPAL[k];c.fillRect(x,y,1,1);}
function mMap(c,map,ox,oy){map.forEach((row,y)=>{for(let x=0;x<row.length;x++)mPx(c,ox+x,oy+y,row[x]);});}
// One leg: jeans from the hip to the ankle, leaning dx pixels; the foot is raised by lift.
function mLeg(c,hipX,hipY,dx,lift,dark){
  const ank=M_ANKLE-lift,span=Math.max(1,M_ANKLE-hipY);
  let x=hipX;
  for(let y=hipY;y<=ank;y++){
    x=hipX+Math.round(dx*(y-hipY)/span);
    mPx(c,x-1,y,'K');mPx(c,x,y,dark?'j':'J');mPx(c,x+1,y,dark?'j':'J');mPx(c,x+2,y,dark?'j':'J');mPx(c,x+3,y,'K');
  }
  mMap(c,M_SHOE,x-1,ank+1);
}
function mArm(c,bob,dx){
  let x=9;
  for(let i=0;i<6;i++){x=9+Math.round(dx*i/5);const y=12+bob+i;mPx(c,x-1,y,'K');mPx(c,x,y,'B');mPx(c,x+1,y,'B');mPx(c,x+2,y,'K');}
  mMap(c,M_HAND,x-1,17+bob);
}
// pose: {front:[dx,lift], back:[dx,lift], arm:dx, bob}
function mFrame(pose){
  const cv=document.createElement('canvas');cv.width=MW;cv.height=MH;const c=cv.getContext('2d');
  const b=pose.bob;
  mLeg(c,8,M_HIP+b,pose.back[0],pose.back[1],true);
  mMap(c,M_BODY,0,10+b);
  mLeg(c,11,M_HIP+b,pose.front[0],pose.front[1],false);
  mMap(c,M_HEAD,0,b);
  mArm(c,b,pose.arm);
  return cv;
}
const M_WALK=[0,1,2,3,4,5].map(f=>{
  const a=f*Math.PI/3,s=Math.sin(a),co=Math.cos(a);
  return mFrame({front:[Math.round(4*s),co>0.1?Math.round(2*co):0],back:[Math.round(-4*s),co<-0.1?Math.round(-2*co):0],
    arm:Math.round(-3*s),bob:Math.abs(s)>0.7?1:0});
});
const M_IDLE=mFrame({front:[1,0],back:[-1,0],arm:0,bob:0});
const M_JUMP=mFrame({front:[3,3],back:[-3,1],arm:4,bob:0});

    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,h*.9,0,7);ctx.fill();

    ctx.fillStyle='#5a2222';ctx.fillRect(x+5,y+27+Math.max(0,f),8,4);ctx.fillRect(x+21,y+27+Math.max(0,-f),8,4);
    ctx.strokeStyle='#C94B4B';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+17,y+4);ctx.lineTo(x+17,y-5);ctx.stroke();
    ctx.fillStyle=t%40<20?'#ff4d4d':'#7a2a2a';ctx.beginPath();ctx.arc(x+17,y-6,3,0,7);ctx.fill();
    ctx.fillStyle=Math.abs(e.vx)>1.5?'#d8433a':'#C94B4B';rr(x,y+3,34,25,6);
    ctx.fillStyle='#f4f4f4';ctx.beginPath();ctx.arc(x+17+dir*3,y+12,6,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+17+dir*5,y+12,3,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='7px "Press Start 2P", monospace';ctx.textAlign='center';ctx.fillText('KYC',x+17,y+26);
  }else{
    ctx.strokeStyle='#4a5a78';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x+4,y+4);ctx.lineTo(x+4,y-2);ctx.moveTo(x+34,y+4);ctx.lineTo(x+34,y-2);ctx.stroke();
    const pw=8+Math.abs(Math.sin(t*.8))*6;
    ctx.fillStyle='#9fb3d6';ctx.fillRect(x+4-pw/2,y-4,pw,2);ctx.fillRect(x+34-pw/2,y-4,pw,2);
    ctx.fillStyle='#6c86b5';rr(x,y+3,38,20,7);
    ctx.fillStyle='#ff5a5a';ctx.beginPath();ctx.arc(x+19+dir*4,y+11,4,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='6px "Press Start 2P", monospace';ctx.textAlign='center';ctx.fillText('CBDC',x+19,y+21);
  }
}
function drawHUD(){
  const L=T[lang];
  ctx.fillStyle='rgba(12,14,19,.65)';rr(10,10,196,82,10);
  ctx.fillStyle='#E8C547';ctx.beginPath();ctx.arc(30,29,8,0,7);ctx.fill();
  ctx.fillStyle='#7a6018';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',30,30);ctx.textBaseline='alphabetic';
  ctx.fillStyle='#e8ecf2';ctx.font='11px "Press Start 2P", monospace';ctx.textAlign='left';ctx.fillText(`${L.fiat} ${lv.fiat}/${lv.coins}`,46,34);
  for(let i=0;i<3;i++){
    ctx.save();ctx.globalAlpha=i<lives?1:.2;ctx.translate(30+i*28,46);ctx.scale(.55,.55);
    ctx.fillStyle='#8BC53F';rr(-16,0,32,22,8);
    ctx.fillStyle='#FFE14D';ctx.beginPath();ctx.ellipse(-6,11,4,4,0,0,7);ctx.ellipse(6,11,4,4,0,0,7);ctx.fill();
    ctx.restore();
  }
  const sz=Math.round(p.s*100);
  ctx.fillStyle='#8BC53F';ctx.font='8px "Press Start 2P", monospace';ctx.textAlign='left';ctx.fillText(`🧌 ${sz}%`,118,62);
  const s=((levelEnd||performance.now())-levelStart)/1000;
  ctx.fillStyle='#8a93a6';ctx.font='9px "Press Start 2P", monospace';ctx.fillText(s.toFixed(1)+'s',22,82);
  if(p.bolt>0){
    ctx.fillStyle='rgba(12,14,19,.65)';rr(10,98,196,24,10);
    ctx.save();ctx.translate(26,110);ctx.fillStyle='#FFE14D';boltPath(.55);ctx.fill();ctx.restore();
    ctx.fillStyle='#262d3a';rr(40,106,154,8,4);
    ctx.fillStyle='#FFE14D';rr(40,106,154*(p.bolt/330),8,4);
  }
  const pw=W<760?190:300,bx=W/2-pw/2,by=24;
  ctx.fillStyle='rgba(12,14,19,.65)';rr(bx-14,10,pw+28,48,14);
  ctx.fillStyle='#262d3a';rr(bx,by,pw,6,3);
  const fr=Math.max(0,Math.min(1,p.x/goal.x));
  ctx.fillStyle='#8BC53F';rr(bx,by,Math.max(6,pw*fr),6,3);
  ctx.beginPath();ctx.arc(bx+pw*fr,by+3,6,0,7);ctx.fill();
  if(goal.final){ctx.fillStyle='#F7931A';ctx.beginPath();ctx.arc(bx+pw,by+3,8,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('₿',bx+pw,by+4);ctx.textBaseline='alphabetic';}
  else{ctx.save();ctx.translate(bx+pw,by+3);ctx.fillStyle='#FFE14D';boltPath(.6);ctx.fill();ctx.restore();}
  ctx.fillStyle='#8a93a6';ctx.font='8px "Press Start 2P", monospace';ctx.textAlign='center';
  ctx.fillText(`${L.level} ${level+1}/3 · ${LEVELS[level].name[lang]}`,W/2,50);
}
function drawBanner(){
  if(banner<=0)return;
  const a=Math.min(1,banner/30,(150-banner)/15);
  ctx.globalAlpha=Math.max(0,a);
  ctx.fillStyle='rgba(12,14,19,.7)';ctx.fillRect(0,H/2-62,W,104);
  ctx.textAlign='center';
  ctx.fillStyle='#8BC53F';ctx.font='14px "Press Start 2P", monospace';ctx.fillText(`${T[lang].level} ${level+1}`,W/2,H/2-24);
  ctx.fillStyle='#e8ecf2';ctx.font='26px "Press Start 2P", monospace';ctx.fillText(LEVELS[level].name[lang],W/2,H/2+18);
  ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(scale,0,0,scale,0,0);
  drawBg();drawWorld();
  if(state!=='menu'){
    enemies.forEach(drawEnemy);
    if(state!=='over'&&!(p.inv>0&&Math.floor(t/5)%2))drawMostro(p.x-cam,p.y,p.s,p.face,Math.abs(p.vx)>.4&&p.onGround,p.chew,p.blink,p.bolt>0,!p.onGround);
  }else{
    drawMostro(Math.min(120,W*.2),G-58,1,1,false,0,false,false,false);
  }
  for(const q of particles){
    ctx.globalAlpha=Math.min(1,q.life/20);ctx.fillStyle=q.color;
    if(q.dot)ctx.fillRect(q.x-cam,q.y,4,4);
    else{ctx.font='9px "Press Start 2P", monospace';ctx.textAlign='center';ctx.fillText(q.text,q.x-cam,q.y);}
  }
  ctx.globalAlpha=1;
  drawRain();
  drawIllumination();
  if(winFlash>0){ctx.fillStyle=`rgba(255,240,210,${winFlash/40*.75})`;ctx.fillRect(0,0,W,H);}
  if(state!=='menu'){drawHUD();drawBanner();}
}

// ================= loop =================
genLevel(0);
let acc=0,last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){update();acc-=1000/60;}
  render();requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0;if(ac){if(document.hidden)ac.suspend();else ac.resume();}});
applyLang();
requestAnimationFrame(frame);
</script>
